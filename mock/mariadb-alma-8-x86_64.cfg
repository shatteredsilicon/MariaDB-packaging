# Local extension of the distribution Mock template; no changes to /etc/mock.
# Judy-devel is in the mariadb-devel:10.3 module of EL8 PowerTools/CRB.
include('alma+epel-8-x86_64.cfg')

# Avoid sharing a chroot/cache with other jobs using the stock target.
config_opts['root'] = 'mariadb-alma-8-x86_64'

# Must be set before Mock installs the SRPM's BuildRequires.
config_opts['module_setup_commands'] = [
    ('enable', 'mariadb-devel:10.3'),
]
