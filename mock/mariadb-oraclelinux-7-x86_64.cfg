# Extend the upstream Oracle Linux 7 Mock target without changing /etc/mock.
include('oraclelinux-7-x86_64.cfg')

# Separate the buildroot/cache from the stock template.
config_opts['root'] = 'mariadb-oraclelinux-7-x86_64'

# Judy-devel, libzstd-devel and cmake3 are in Oracle's developer EPEL.
# The GCC 11 build toolchain is in Oracle's software collections repo.
repo_key = 'dnf.conf' if 'dnf.conf' in config_opts else 'yum.conf'
config_opts[repo_key] += '''

[ol7_developer_EPEL_for_mariadb]
name=Oracle Linux 7 developer EPEL for MariaDB
baseurl=https://yum.oracle.com/repo/OracleLinux/OL7/developer_EPEL/x86_64/
enabled=1
gpgcheck=1
gpgkey=https://yum.oracle.com/RPM-GPG-KEY-oracle-ol7

[ol7_software_collections_for_mariadb]
name=Oracle Linux 7 Software Collections for MariaDB
baseurl=https://yum.oracle.com/repo/OracleLinux/OL7/SoftwareCollections/x86_64/
enabled=1
gpgcheck=1
gpgkey=https://yum.oracle.com/RPM-GPG-KEY-oracle-ol7
'''
